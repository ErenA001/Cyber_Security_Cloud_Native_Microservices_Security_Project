name: cloudguard-ai

services:
  edge:
    image: cloudguard-ai/edge:local
    build:
      context: .
      dockerfile: edge-proxy/Dockerfile
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      gateway:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      frontend: {}
      host_ingress:
        gw_priority: 1
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/api/health >/dev/null 2>&1"]
      interval: 20s
      timeout: 3s
      retries: 3
      start_period: 5s
    pids_limit: 64
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
    restart: unless-stopped

  gateway:
    image: cloudguard-ai/gateway:local
    build:
      context: .
      dockerfile: gateway/Dockerfile
    depends_on:
      auth:
        condition: service_healthy
      ai:
        condition: service_healthy
      monitor:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - frontend
      - backend
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/api/health >/dev/null 2>&1"]
      interval: 20s
      timeout: 3s
      retries: 3
      start_period: 5s
    pids_limit: 128
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

  auth:
    image: cloudguard-ai/auth:local
    build:
      context: .
      dockerfile: services/auth/Dockerfile
    environment:
      AUTH_DATABASE_PATH: /data/auth.db
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Run python3 scripts/setup.py first}
      SERVICE_TOKEN: ${SERVICE_TOKEN:?Run python3 scripts/setup.py first}
      ACCESS_TOKEN_MINUTES: ${ACCESS_TOKEN_MINUTES:-60}
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:-admin}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:?Run python3 scripts/setup.py first}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    volumes:
      - auth_data:/data
    expose:
      - "8000"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - backend
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 20s
      timeout: 3s
      retries: 3
      start_period: 10s
    pids_limit: 128
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

  ai:
    image: cloudguard-ai/ai:local
    build:
      context: .
      dockerfile: services/ai/Dockerfile
    environment:
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Run python3 scripts/setup.py first}
      SERVICE_TOKEN: ${SERVICE_TOKEN:?Run python3 scripts/setup.py first}
      ACCESS_TOKEN_MINUTES: ${ACCESS_TOKEN_MINUTES:-60}
      NVIDIA_API_KEY: ${NVIDIA_API_KEY:-}
      NVIDIA_MODEL: ${NVIDIA_MODEL:-nvidia/nemotron-3.5-bolt-e4b}
      NVIDIA_BASE_URL: ${NVIDIA_BASE_URL:-https://integrate.api.nvidia.com/v1/chat/completions}
      NVIDIA_TIMEOUT_SECONDS: ${NVIDIA_TIMEOUT_SECONDS:-45}
      MONITOR_RECENT_URL: http://monitor:8000/internal/recent-events
      MONITOR_SCANS_URL: http://monitor:8000/internal/recent-scan-reports
      AI_DATABASE_PATH: /data/ai.db
    volumes:
      - ai_data:/data
    expose:
      - "8000"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - egress
      - backend
    depends_on:
      monitor:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 20s
      timeout: 3s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  monitor:
    image: cloudguard-ai/monitor:local
    build:
      context: .
      dockerfile: services/monitor/Dockerfile
    environment:
      MONITOR_DATABASE_PATH: /data/events.db
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Run python3 scripts/setup.py first}
      SERVICE_TOKEN: ${SERVICE_TOKEN:?Run python3 scripts/setup.py first}
      ACCESS_TOKEN_MINUTES: ${ACCESS_TOKEN_MINUTES:-60}
    volumes:
      - monitor_data:/data
    expose:
      - "8000"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - backend
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 20s
      timeout: 3s
      retries: 3
      start_period: 10s
    pids_limit: 128
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

networks:
  # Host-published edge proxy only. The app gateway and microservices stay internal.
  host_ingress:
    driver: bridge
  frontend:
    driver: bridge
    internal: true
  backend:
    driver: bridge
    internal: true
  egress:
    driver: bridge

volumes:
  auth_data:
  ai_data:
  monitor_data:
