services:
  gateway:
    image: nginx:1.18
    ports: ["8080:80"]
    volumes: ["./gateway/nginx.conf:/etc/nginx/nginx.conf:ro"]
    depends_on: [auth, ai, logger]
  auth:
    build: ./services/auth
    ports: ["5001:5000"]      # INSECURE: servis dogrudan disariya acik
  ai:
    build: ./services/ai
    ports: ["5002:5000"]      # INSECURE
    env_file: .env            # INSECURE: anahtar duz ortam degiskeni
  logger:
    build: ./services/logger
    ports: ["5003:5000"]      # INSECURE
