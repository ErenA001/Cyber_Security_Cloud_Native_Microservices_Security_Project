pid /tmp/nginx.pid;
worker_processes auto;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    sendfile on;
    keepalive_timeout 30;
    client_body_temp_path /tmp;
    proxy_temp_path /tmp;
    fastcgi_temp_path /tmp;
    uwsgi_temp_path /tmp;
    scgi_temp_path /tmp;

    limit_req_zone $binary_remote_addr zone=general_api:10m rate=12r/s;
    limit_req_zone $binary_remote_addr zone=login_api:10m rate=5r/m;
    limit_req_zone $binary_remote_addr zone=ai_api:10m rate=6r/m;
    limit_conn_zone $binary_remote_addr zone=connections_per_ip:10m;
    limit_req_status 429;

    log_format cloudguard '$remote_addr [$time_iso8601] "$request" $status $body_bytes_sent request_id=$request_id';
    access_log /dev/stdout cloudguard;

    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;
        client_max_body_size 256k;
        client_body_timeout 10s;
        client_header_timeout 10s;
        send_timeout 30s;
        limit_conn connections_per_ip 20;

        add_header X-Request-ID $request_id always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;

        error_page 429 = @rate_limited;
        location @rate_limited {
            default_type application/json;
            return 429 '{"detail":"Too many requests. Wait briefly and try again."}';
        }

        location = /api/health {
            default_type application/json;
            return 200 '{"status":"ok","service":"gateway"}';
        }

        location = /api/auth/login {
            limit_req zone=login_api burst=3 nodelay;
            proxy_pass http://auth:8000/login;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            proxy_connect_timeout 5s;
            proxy_read_timeout 15s;
        }

        location /api/auth/ {
            limit_req zone=general_api burst=20 nodelay;
            proxy_pass http://auth:8000/;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            proxy_connect_timeout 5s;
            proxy_read_timeout 15s;
        }

        location /api/ai/ {
            limit_req zone=ai_api burst=3 nodelay;
            proxy_pass http://ai:8000/;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            proxy_connect_timeout 5s;
            proxy_read_timeout 75s;
        }

        location ^~ /api/monitor/internal/ {
            default_type application/json;
            return 404 '{"detail":"Internal service routes are not exposed through the gateway."}';
        }

        location /api/monitor/ {
            limit_req zone=general_api burst=30 nodelay;
            proxy_pass http://monitor:8000/;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            proxy_connect_timeout 5s;
            proxy_read_timeout 20s;
        }

        location ^~ /api/ {
            default_type application/json;
            return 404 '{"detail":"API route not found."}';
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
